version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    groups:
      all-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Keep Node typings aligned with the Node 24 LTS runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) is not yet supported by typescript-eslint (<6.1).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
